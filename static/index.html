<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">

    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 28 28"><rect width="28" height="28" rx="7"/><circle cx="11" cy="14" r="6.5"/><circle cx="17" cy="14" r="6.5"/></svg></span>
      <div><b>BrandLoom</b><small>Demo brand: Lumora (fictional)</small></div>
    </div>
    <nav aria-label="Main">
      <a href="#/new" data-nav="new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M9 14l2 2 4-4"/></svg><span>Check content</span></a>
      <a href="#/queue" data-nav="queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Queue</span></a>
      <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h10"/></svg><span>Brand library</span></a>

    <div class="side-foot">
      <label class="who"><span>Signed in as</span>
        <select id="user" aria-label="Choose demo user"></select>
      </label>
      <p class="aibar" role="note">Findings come from your approved library using rules. No AI model reads your content in this version and nothing leaves this server. People make every approval decision.</p>
    </div>
  </aside>
  <div class="stage">
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="assertive"></div>
<script src="app.js"></script>
